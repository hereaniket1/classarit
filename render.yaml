services:
  - type: web
    name: classarit
    runtime: python
    plan: starter
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: CLASSARIT_DATA_DIR
        value: /var/data
    disk:
      name: classarit-data
      mountPath: /var/data
      sizeGB: 1
