<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Classarit helps independent teachers manage students, classes, payments and learning materials.">
  <title>{% block title %}Classarit — The flow of knowledge{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/auth.css">
  <script src="/static/auth.js" defer></script>
</head>
<body>
  <header class="public-header">
    <a class="public-brand" href="/" aria-label="Classarit home"><span class="brand-mark">C</span><span>Classarit</span></a>
    <nav class="public-nav" aria-label="Main navigation">
      <a class="login-link" href="/login">Log in</a>
      <button type="button" class="btn btn-primary" data-signup>Sign up</button>
    </nav>
  </header>
  {% block content %}{% endblock %}
  <footer class="public-footer">Classarit <span>·</span> The flow of knowledge.</footer>
  <div class="signup-toast" id="signup-toast" role="status" aria-live="polite" hidden>
    <div><strong>Signup is coming soon</strong><p>For now, you can continue with Google.</p></div>
    <button type="button" aria-label="Dismiss notification" data-dismiss-toast>×</button>
  </div>
</body>
</html>
